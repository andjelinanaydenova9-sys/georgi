
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>За теб ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-hearts" id="hearts"></div>

    <div class="animals">
        <div class="animal pig">🐷</div>
        <div class="kiss">💋</div>
        <div class="animal frog">🐸</div>
    </div>

    <div class="card-container" id="card">

        <div class="card-inside">
            <div class="message" id="message">
                <h1>Моя Любов ❤️</h1>

                <div class="line"></div>

                <p>
                    Ти си цвета в моя живот, музиката,
					която слушам всеки ден, и крем карамелът,
					който обичам. Ти си причината да се старая
					да бъда по - добър човек,
                </p>

                <p>
                    Ти си моето "ЗАЩО"!
                </p>

                <div class="final-heart">❤️</div>
                <h2>Цункам те</h2>
            </div>
        </div>

        <div class="card-cover">
            <div class="cover-decoration">
                <div class="big-heart">❤️</div>
                <h2>ЦУН, ЦУН</h2>
                <p>Докосни, за да отвориш</p>
                <div class="click-icon">☝️</div>
            </div>
        </div>

    </div>

    <!-- Скрит YouTube аудиоплейър -->
   <iframe
    id="music"
    width="0"
    height="0"
    allow="autoplay"
    frameborder="0">
</iframe>

    <div class="instruction" id="instruction">
        Докосни картичката, за да я отвориш
    </div>

    <script src="script.js"></script>
</body>
</html>
